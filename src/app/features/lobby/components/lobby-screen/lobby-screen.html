<!-- Fills the layout's 1280x644 content area: Battle Finder on 2/3 (853px), chat on 1/3 (427px). See styles.css for why sizes are fixed. -->
<div class="flex h-[644px] w-[853px] flex-col items-center justify-center gap-4">
  <app-battle-finder (findBattle)="startBattle()" />
  <button
    type="button"
    class="h-14 w-[560px] cursor-pointer rounded-md border border-gray-400 bg-card text-xl font-bold text-white hover:bg-tab-hover"
    (click)="watchReplays()"
  >
    Watch replays
  </button>
</div>
<app-lobby-chat class="h-[644px] w-[427px]" />
