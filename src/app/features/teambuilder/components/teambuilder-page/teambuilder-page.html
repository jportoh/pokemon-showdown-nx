<!--
  Fills the layout's 1280x644 content area: a 360px team list and a 920px panel. The panel's views are
  all mounted and only shown or hidden, never inserted later (Brewser layout rules, see styles.css).
  B (appBack) goes back one step: from a team to the list, from the editor or the validation to the team.
-->
<app-team-list
  class="absolute top-0 left-0 h-[644px] w-[360px] border-r border-retro-outline"
  [teams]="store.teams()"
  [selectedId]="selectedId()"
  (select)="selectTeam($event)"
  (create)="createTeam()"
/>

<div class="absolute top-0 left-[360px] h-[644px] w-[920px]">
  <div class="h-[644px] w-[920px] p-8" [class.hidden]="view() !== 'empty'">
    <p class="text-lg text-retro-muted">Select a team, or build a new one with New.</p>
    @if (store.saveFailed()) {
      <p role="alert" class="text-base leading-8 font-bold text-retro-danger">Your last change couldn't be saved on this device.</p>
    }
  </div>
  <app-team-detail
    [class.hidden]="view() !== 'team'"
    [team]="selectedTeam()"
    (appBack)="focusTeamList()"
    (renamed)="renameTeam($event)"
    (formatChanged)="changeFormat($event)"
    (validate)="showValidation()"
    (deleted)="deleteTeam()"
    (editSlot)="editSlot($event)"
  />
  <app-set-editor [class.hidden]="view() !== 'edit'" [team]="selectedTeam()" [index]="editIndex()" (closed)="closeEditor()" (appBack)="closeEditor()" />
  <app-team-validation-panel
    [class.hidden]="view() !== 'validate'"
    [team]="selectedTeam()"
    (back)="closeValidation()"
    (appBack)="closeValidation()"
  />
</div>
