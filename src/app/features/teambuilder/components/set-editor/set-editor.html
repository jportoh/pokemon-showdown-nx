<!--
  Fixed 920x644 panel (see styles.css): a 64px header (back, slot title, tabs, remove) over either the
  Details tab (the set's cards on the left, the list chooser on the right) or the Stats tab. Every
  control sits at a fixed absolute position, and both tabs and the chooser stay mounted and are only
  shown or hidden (Brewser layout rules, seen on device).
  Lists open in the chooser so picking takes the d-pad (and, for species and items, a few letters)
  instead of typing names.
-->
<div class="relative h-16 w-[920px]">
  <button
    type="button"
    (click)="closed.emit()"
    class="absolute top-[10px] left-6 h-9 w-[132px] cursor-pointer rounded-md border-2 border-retro-outline bg-retro-button text-base text-retro-ink hover:bg-retro-select focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white"
  >
    <!-- The Battle page's pixel triangle (Brewser draws ◀ as an emoji). -->
    <svg aria-hidden="true" viewBox="0 0 4 7" class="absolute top-[9px] left-[36px] h-[14px] w-2 fill-retro-ink"><path d="M3 0h1v7h-1v-1h-1v-1h-1v-1h-1v-1h1v-1h1v-1h1z" /></svg>
    <span class="absolute top-0 left-[52px] block h-8 w-[60px] text-left leading-8">Team</span>
  </button>
  <h2 class="absolute top-[14px] left-[168px] block h-7 w-[340px] overflow-hidden text-xl leading-7 font-bold whitespace-nowrap text-retro-ink">
    {{ title() }}
  </h2>
  <!--
    The tabs are L and R on the controller and Remove is ZR, so the d-pad skips them (data-kb-skip).
    Shortcut and label sit apart: an inline pill before the text threw the centring off on the console.
  -->
  <button
    type="button"
    data-kb-skip
    [attr.aria-pressed]="tab() === 'details'"
    (click)="tab.set('details')"
    class="absolute top-[10px] left-[520px] h-9 w-[112px]"
    [class]="tab() === 'details' ? tabPickedClass : tabClass"
  >
    <span aria-hidden="true" [class]="shortcutClass">L</span>
    <span class="absolute top-0 left-[46px] block h-8 w-[58px] text-center leading-8">Details</span>
  </button>
  <button
    type="button"
    data-kb-skip
    [attr.aria-pressed]="tab() === 'stats'"
    [disabled]="!pokemon()"
    (click)="tab.set('stats')"
    class="absolute top-[10px] left-[640px] h-9 w-[112px]"
    [class]="tab() === 'stats' ? tabPickedClass : tabClass"
  >
    <span aria-hidden="true" [class]="shortcutClass">R</span>
    <span class="absolute top-0 left-[46px] block h-8 w-[58px] text-center leading-8">Stats</span>
  </button>
  <button
    type="button"
    data-kb-skip
    (click)="pressRemove()"
    [class.hidden]="!pokemon()"
    [attr.aria-label]="confirmingRemove() ? 'Confirm removing ' + title() : 'Remove ' + title()"
    class="absolute top-[10px] left-[764px] h-9 w-[132px]"
    [class]="confirmingRemove() ? confirmClass : tabClass"
  >
    <span aria-hidden="true" [class]="shortcutClass">ZR</span>
    <span aria-hidden="true" class="absolute top-0 left-[46px] block h-8 w-[78px] text-center leading-8">
      {{ confirmingRemove() ? 'Confirm' : 'Remove' }}
    </span>
  </button>
</div>

<!--
  Tabs: toggled blocks in normal flow. On Brewser, an absolutely positioned element that is hidden and
  shown again loses its positioned descendants (seen on device), so only these plain wrappers toggle.
-->
<!--
  Details tab: the set's cards on the left (species with its gender, item, ability, the moves) and,
  beside them, the list chooser for the card pressed, or a hint.
-->
<div [class.hidden]="tab() !== 'details'">
  <div class="relative h-[580px] w-[920px]">
    <div class="absolute top-2 left-6 w-[420px]">
      <app-set-details
        [set]="pokemon()"
        [species]="species()"
        [mega]="mega()"
        [activeField]="activeField()"
        (fieldOpened)="openChooser($event)"
        (genderChanged)="update({ gender: $event })"
      />
    </div>

    <div class="absolute top-2 left-[476px] w-[420px]">
      <div class="block" [class.hidden]="!!activeField()">
        <div class="absolute top-0 left-0 block h-[552px] w-[420px] rounded-lg border-2 border-dashed border-retro-rim">
          <p class="absolute top-[196px] left-[24px] block h-8 w-[368px] text-center text-lg leading-8 text-retro-muted">Press A on a card to pick from a list.</p>
          <p class="absolute top-[236px] left-[24px] block h-8 w-[368px] text-center text-base leading-8 text-retro-muted">For species and items, a few letters</p>
          <p class="absolute top-[264px] left-[24px] block h-8 w-[368px] text-center text-base leading-8 text-retro-muted">in the search box narrow it down.</p>
          <p class="absolute top-[304px] left-[24px] block h-8 w-[368px] text-center text-base leading-8 text-retro-muted">Left/right on the species change its gender.</p>
        </div>
      </div>
    </div>
    <!--
      The chooser for the card pressed, in a panel that ends 20px above the screen's bottom (536 tall
      plus the frame). Only the plain wrapper toggles (Brewser layout rules).
    -->
    <div class="absolute top-2 left-[476px] w-[420px]">
      <div class="block" [class.hidden]="!activeField()">
        <div class="absolute top-0 left-0 block h-[552px] w-[420px] rounded-lg border-2 border-retro-outline bg-retro-panel">
          <app-dex-chooser
            id="set-chooser"
            class="absolute top-[6px] left-[4px]"
            (appBack)="closeChooser()"
            [title]="chooserTitle()"
            [options]="chooserOptions()"
            [selectedId]="chooserSelectedId()"
            [searchable]="chooserSearchable()"
            [suggested]="chooserSuggested()"
            suggestedLabel="Popular items"
            [withIcons]="activeField() === 'item'"
            [withCategories]="isMoveField()"
            [clearLabel]="chooserClearLabel()"
            (cleared)="pressClear()"
            [unavailable]="chooserUnavailable()"
            (picked)="pick($event)"
          />
        </div>
      </div>
    </div>
  </div>
</div>

<!--
  Stats tab: the stat points and the nature right under the header and, for a Mega, what it Mega Evolves
  into beside the stat points' title, over the side panel.
-->
<div [class.hidden]="tab() !== 'stats'">
  <div class="relative h-[580px] w-[920px]">
    <div class="absolute top-2 left-6 w-[872px]">
      @if (pokemon(); as current) {
        <app-set-stats
          [set]="current"
          [baseStats]="baseStats()"
          (pointsChanged)="updateStatPoints($event)"
          (natureChanged)="update({ nature: $event })"
        />
      }
    </div>
    <p class="absolute top-2 left-[476px] block h-7 w-[420px] overflow-hidden text-sm leading-7 whitespace-nowrap text-retro-muted">
      {{ megaSummary() }}
    </p>
  </div>
</div>
