<!-- Fixed 76px header; the active tab shares the stage color so it reads as joined to the page below. -->
<header class="relative flex h-19 shrink-0 items-end gap-5 bg-header p-[0_12px]">
  <img
    ngSrc="https://play.pokemonshowdown.com/pokemonshowdownbeta@2x.png"
    alt="Pokémon Showdown"
    width="146"
    height="44"
    priority
    class="mb-4 h-11 w-[146px] max-w-none"
  />
  <nav aria-label="Navegación principal" class="flex flex-row gap-1">
    <a
      class="flex h-[52px] w-[112px] flex-col items-center justify-center gap-1 rounded-t-lg bg-tab text-sm font-bold text-gray-200 hover:bg-tab-hover focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-white aria-[current=page]:bg-stage aria-[current=page]:text-white"
      routerLink="/"
      routerLinkActive
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <svg aria-hidden="true" viewBox="0 0 16 16" class="size-5 fill-white">
        <path d="M8 1 1 7h2v7h4v-4h2v4h4V7h2z" />
      </svg>
      <span>Home</span>
    </a>
    <a
      class="flex h-[52px] w-[112px] flex-col items-center justify-center gap-1 rounded-t-lg bg-tab text-sm font-bold text-gray-200 hover:bg-tab-hover focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-white aria-[current=page]:bg-stage aria-[current=page]:text-white"
      routerLink="/teambuilder"
      routerLinkActive
      ariaCurrentWhenActive="page"
    >
      <svg aria-hidden="true" viewBox="0 0 16 16" class="size-5">
        <rect x="1.75" y="1.75" width="12.5" height="12.5" rx="1" fill="none" stroke-width="1.5" class="stroke-white" />
        <rect x="5" y="5" width="6" height="6" class="fill-white" />
      </svg>
      <span>Teambuilder</span>
    </a>
  </nav>
  <!--
    What the console's buttons do (see core/input/console-keys). Fixed 150px items at absolute
    positions: Brewser ignores margins on inline elements, and the header never moves.
  -->
  <p aria-label="Controller buttons" class="absolute top-7 left-[668px] h-6 w-[600px] text-sm text-gray-200">
    @for (item of legend; track item.button; let i = $index) {
      <span class="absolute top-0 block h-6 w-[150px] leading-6" [style.left.px]="i * 150"
        ><span class="rounded-sm bg-tab p-[2px_6px] font-bold text-white">{{ item.button }}</span
        >{{ ' ' + item.legend }}</span
      >
    }
  </p>
</header>

<!-- 644px = 720px stage - 76px header. See styles.css for why sizes are fixed. -->
<main class="h-[644px] w-[1280px]">
  <router-outlet />
</main>
