<!-- Fixed 76px bar: the page's icon and title, how to go back, a challenge notice and the trainer's status. -->
<header class="relative block h-19 w-[1280px] bg-retro-bar">
  @if (page(); as page) {
    <app-pixel-icon class="absolute top-[14px] left-[24px]" [name]="page.icon" [size]="48" />
    <h1 class="absolute top-[18px] left-[88px] block h-10 w-[260px] text-4xl leading-10 font-bold text-retro-ink">{{ page.title }}</h1>
  }
  <!-- The way back: a button for pointers, B on the controller (the page's appBack below). -->
  <button
    type="button"
    data-kb-skip
    class="absolute top-[20px] left-[360px] h-9 w-[112px] cursor-pointer rounded-md border-2 border-retro-outline bg-retro-button text-lg font-bold text-retro-ink hover:bg-retro-select"
    [attr.aria-label]="backLabel()"
    (click)="back()"
  >
    <!-- The shortcut and the label apart: an inline pill before the text threw the centring off on the console. -->
    <span aria-hidden="true" class="absolute top-[4px] left-[8px] block h-6 w-7 rounded-sm bg-retro-select text-center leading-6">B</span>
    <span class="absolute top-0 left-[40px] block h-8 w-[60px] text-center leading-8">Back</span>
  </button>
  <!-- The Battle page shows the challenge itself. -->
  @if (page()?.icon !== 'battle') {
    <app-challenge-notice class="absolute top-[20px] left-[496px]" />
  }
  <app-trainer-status class="absolute top-[24px] left-[896px]" />
</header>

<!-- 644px = 720px stage - 76px bar. See styles.css for why sizes are fixed. -->
<main class="block h-[644px] w-[1280px]" (appBack)="back()">
  <router-outlet />
</main>
