name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used on tags, to publish the release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The native Switch app (docs/native.md): ng build, then the pinned nx.js_extended engine
      # (downloaded and checked) with the app in its RomFS. Named after the tag on releases and after
      # the commit otherwise, so each .nro tested on the console can be traced back to its code.
      - name: Build the .nro
        id: nro
        run: |
          npm run build:nro
          if [ "$GITHUB_REF_TYPE" = tag ]; then label="$GITHUB_REF_NAME"; else label="$(git rev-parse --short HEAD)"; fi
          file="dist/nro/pokemon-showdown-$label.nro"
          mv dist/nro/pokemon-showdown.nro "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      # The file itself: copied to sdmc:/switch/ as it is.
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.nro.outputs.file }}
          archive: false
          retention-days: 30

      # The online update (docs/updates.md): the app's code bundle and its manifest, signed with the
      # UPDATE_SIGNING_KEY secret. The app finds them at releases/latest/download/update.json and
      # fetches the bundle from the tag v<version>, so the tag must match package.json.
      - name: Sign the online update
        if: github.ref_type == 'tag'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then echo "Tag $GITHUB_REF_NAME doesn't match package.json ($version)"; exit 1; fi
          node scripts/sign-update.mjs

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.nro.outputs.file }}" dist/nro/update/* --verify-tag --generate-notes
